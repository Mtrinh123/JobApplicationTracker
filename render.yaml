# Render blueprint: the FastAPI backend and its Postgres database.
# The frontend goes on Vercel with API_URL set to this service's URL.
services:
  - type: web
    name: jobtracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: COOKIE_SECURE
        value: "1"
      # The Vercel URL, for links in emails. Set these in the Render dashboard
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMTP_FROM
        sync: false
