services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:5433:5432"  # localhost only, the password here is not secret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
